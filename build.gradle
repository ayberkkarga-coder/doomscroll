plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Duman testi: run/saves/"New World" dogrudan acilir (dunya yoksa ana menu)
			programArgs "--quickPlaySingleplayer", "New World"
			vmArg "-Ddoomscroll.selftest=true"
		}
	}

	mods {
		"doomscroll" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Kardes proje mcef-codec'in jar'i: surum numarasini kaliba yazmiyoruz ki mcef-codec
// surum atlayinca burasi sessizce bos kalmasin. Bos kalirsa derleme anlasilir bir hata versin.
def mcefJars = fileTree(dir: "../mcef-codec/build/libs", include: "mcef-codec-*.jar", excludes: ["*-sources.jar"])

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Codec'li Chromium katmani; calisma zamaninda mods klasorunde ayri jar olarak durur
	compileOnly mcefJars
	// Gelistirme istemcisi (./gradlew runClient) icin ayni jar mod olarak yuklensin
	runtimeOnly mcefJars
}

tasks.named("compileJava").configure {
	doFirst {
		if (mcefJars.isEmpty()) {
			throw new GradleException("mcef-codec jar'i bulunamadi. Once kardes projeyi derle:\n" +
					"  cd ../mcef-codec && ./gradlew build\n" +
					"Beklenen yer: ../mcef-codec/build/libs/mcef-codec-*.jar")
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("NOTICE") {
		rename { "${it}_$projectName" }
	}
	// Jersey 10 yazi tipi font.css icine gomulu geliyor; OFL 1.1 metnin de her kopyayla
	// birlikte dagitilmasini istiyor.
	from("LICENSE-jersey10") {
		into "META-INF"
	}
}
