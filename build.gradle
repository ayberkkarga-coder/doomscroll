plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Duman testi: run/saves/"New World" dogrudan acilir (dunya yoksa ana menu)
			programArgs "--quickPlaySingleplayer", "New World"
			vmArg "-Ddoomscroll.selftest=true"
		}
	}

	mods {
		"doomscroll" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Codec'li Chromium katmani (kardes proje); calisma zamaninda mods klasorunde ayri jar
	compileOnly files("../mcef-codec/build/libs/mcef-codec-0.1.0.jar")
	// Gelistirme istemcisi (./gradlew runClient) icin ayni jar mod olarak yuklensin
	runtimeOnly files("../mcef-codec/build/libs/mcef-codec-0.1.0.jar")

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {}
}
