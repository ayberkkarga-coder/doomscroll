plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Smoke test: run/saves/"New World" opens directly (main menu if the world doesn't exist)
			programArgs "--quickPlaySingleplayer", "New World"
			vmArg "-Ddoomscroll.selftest=true"
		}
	}

	mods {
		"doomscroll" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Jar of the sibling project mcef-codec: the version number is left out of the pattern so that when mcef-codec
// bumps its version this does not silently end up empty. If it is empty, the build fails with a clear error.
def mcefJars = fileTree(dir: "../mcef-codec/build/libs", include: "mcef-codec-*.jar", excludes: ["*-sources.jar"])

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Chromium layer with codecs; at runtime it sits in the mods folder as a separate jar
	compileOnly mcefJars
	// Load the same jar as a mod for the development client (./gradlew runClient)
	runtimeOnly mcefJars
}

tasks.named("compileJava").configure {
	doFirst {
		if (mcefJars.isEmpty()) {
			throw new GradleException("mcef-codec jar not found. Build the sibling project first:\n" +
					"  cd ../mcef-codec && ./gradlew build\n" +
					"Expected at: ../mcef-codec/build/libs/mcef-codec-*.jar")
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("NOTICE") {
		rename { "${it}_$projectName" }
	}
	// The Jersey 10 font ships embedded in font.css; OFL 1.1 requires the license text to be distributed
	// with every copy as well.
	from("LICENSE-jersey10") {
		into "META-INF"
	}
}
