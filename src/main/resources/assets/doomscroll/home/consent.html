<!doctype html>
<html lang="{{home.doomscroll.html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{home.doomscroll.consent_title}}</title>
<style>
/*__KIT__*/
body{display:flex;align-items:center;justify-content:center;background:var(--tile-screen) repeat;background-size:64px 64px;font-size:18px}
body:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.42)}
.card{position:relative;width:min(760px,80vw);padding:30px 34px;text-align:center;
  background:var(--tile-panel) repeat;background-size:64px 64px;border:2px solid #000;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),0 0 0 4px rgba(0,0,0,.55)}
.shield{width:34px;height:34px;margin:0 auto 16px;background:var(--dim);
  -webkit-mask:var(--ic-lock) center/contain no-repeat;mask:var(--ic-lock) center/contain no-repeat}
.card svg{display:none}
h1{margin:0 0 10px;font-size:clamp(22px,3.4vw,34px);font-weight:400;text-shadow:3px 3px 0 var(--sh)}
.host{display:inline-block;margin:8px 0 6px;padding:7px 16px;font-size:clamp(19px,3vw,28px);word-break:break-all;
  background:var(--field);border:2px solid #000;
  box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 #3a3a46,0 0 0 2px var(--edge);text-shadow:2px 2px 0 var(--sh)}
.who{margin-top:8px;color:var(--dim);font-size:17px;text-shadow:2px 2px 0 var(--sh)}
.who b{color:var(--ink);font-weight:400}
p{margin:16px auto 0;max-width:52ch;color:var(--dim);font-size:17px;line-height:1.45;text-shadow:2px 2px 0 var(--sh)}
.row{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{font-family:inherit;font-size:19px;padding:11px 24px;cursor:pointer;color:var(--ink);
  background:var(--btn);border:2px solid #000;
  box-shadow:inset 2px 2px 0 var(--btn-hi),inset -2px -2px 0 var(--lo);text-shadow:2px 2px 0 var(--sh)}
button:hover{background:var(--btn-hi)}
button:active{box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--btn-hi)}
button.ok{background:var(--btn-on)}
button.ok:hover{background:#5a739a}
.foot{margin-top:22px;font-size:14px;color:#4e5265;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="shield"></div>
  <h1>{{home.doomscroll.consent_title}}</h1>
  <div class="host" id="host">?</div>
  <div class="who" id="who"></div>
  <p>{{home.doomscroll.consent_text}}</p>
  <div class="row">
    <button class="ok" id="show">{{home.doomscroll.consent_show}}</button>
    <button id="home">{{home.doomscroll.consent_home}}</button>
  </div>
  <div class="foot">doomscroll</div>
</div>
<script>
/*__DATA__*/
(function () {
  var D = window.__DS || {};
  var host = D.host || '?';
  document.getElementById('host').textContent = host;
  if (D.by) {
    document.getElementById('who').innerHTML = '{{js:home.doomscroll.consent_by}} <b></b>';
    document.getElementById('who').querySelector('b').textContent = D.by;
  }
  function cmd(o) { console.log('__DS__' + JSON.stringify(o)); }
  document.getElementById('show').onclick = function () { cmd({home: 'trust', host: host}); };
  document.getElementById('home').onclick = function () { cmd({home: 'consentHome'}); };
})();
</script>
</body>
</html>
