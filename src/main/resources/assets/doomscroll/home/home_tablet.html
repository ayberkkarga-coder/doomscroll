<!doctype html>
<html lang="{{home.doomscroll.html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{home.doomscroll.tablet_title}}</title>
<style>
/*__KIT__*/
:root{--cell:122px;--row:118px;--icon:62px}
html,body{overflow:hidden}
body{display:flex;flex-direction:column;position:relative;background:#101219;font-size:17px}

/* duvar: piksel karo + duz koyulastirma (degrade yok) */
.wall{position:fixed;inset:0;z-index:-2;background:var(--tile-wall) repeat;background-size:64px 64px}
.wall:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
.grain{display:none}

/* durum cubugu */
.status{display:flex;justify-content:space-between;align-items:center;padding:9px 16px 4px;height:34px;font-size:18px;flex:none}
.status .date{color:var(--dim);margin-left:10px}
.status .right{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:15px}
.status svg{display:none}
/* piksel pil */
.bat{display:inline-block;width:22px;height:11px;border:2px solid var(--dim);position:relative}
.bat:before{content:"";position:absolute;inset:2px;right:6px;background:var(--dim)}
.bat:after{content:"";position:absolute;left:100%;top:3px;width:2px;height:5px;background:var(--dim)}

/* arama: icine basik alan */
.spot{display:flex;align-items:center;gap:9px;width:min(600px,74%);margin:6px auto 12px;padding:8px 12px;flex:none;
  background:var(--field);border:2px solid #000;
  box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 #3a3a46,0 0 0 2px var(--edge)}
.spot svg{display:none}
.spot:before{content:"";width:15px;height:15px;flex:none;background:var(--faint);
  -webkit-mask:var(--ic-search) center/contain no-repeat;mask:var(--ic-search) center/contain no-repeat}
.spot input{flex:1;font-size:18px}
.spot:focus-within{box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 #3a3a46,0 0 0 2px #b9bccb}

/* izgara */
.pages{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell),1fr));grid-auto-rows:var(--row);
  gap:12px 8px;justify-items:center;align-content:start}

/* uygulama */
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:var(--cell);text-decoration:none;
  color:var(--ink);position:relative;cursor:pointer}
.icon{width:var(--icon);height:var(--icon);display:flex;align-items:center;justify-content:center;position:relative;
  border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.28),inset -2px -2px 0 rgba(0,0,0,.45);
  font-size:calc(var(--icon)*.46);line-height:1}
.app:hover .icon{filter:brightness(1.18)}
.app:active .icon{filter:brightness(.84);box-shadow:inset 2px 2px 0 rgba(0,0,0,.45),inset -2px -2px 0 rgba(255,255,255,.28)}
.icon svg{width:54%;height:54%;display:block;shape-rendering:crispEdges}
.icon>*{position:relative;z-index:1}
.label{font-size:16px;max-width:var(--cell);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

/* kaldir: kucuk kirmizi kare, piksel carpi */
.rm{position:absolute;left:calc(50% - var(--icon)/2 - 7px);top:-6px;width:18px;height:18px;display:none;z-index:2;
  background:var(--red);border:2px solid #000;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),inset -1px -1px 0 rgba(0,0,0,.45);
  font-size:0;color:transparent}
.rm:after{content:"";position:absolute;inset:3px;background:#fff;
  -webkit-mask:var(--ic-close) center/contain no-repeat;mask:var(--ic-close) center/contain no-repeat}
.app:hover .rm{display:block}
.rm:hover{background:#e0564c}

/* widget: kabartma panel */
.widget{grid-column:span 2;grid-row:span 2;width:100%;height:100%;padding:11px 13px;display:flex;flex-direction:column;
  overflow:hidden;justify-self:stretch;
  background:var(--tile-panel) repeat;background-size:64px 64px;border:2px solid #000;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.widget h3{font-size:15px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-weight:400}
.widget h3 span{cursor:pointer;color:var(--faint)}
.widget h3 span:hover{color:var(--ink)}
.widget .rows{display:flex;flex-direction:column;gap:1px;overflow:hidden}
.wrow{display:flex;align-items:center;gap:8px;padding:4px 5px;cursor:pointer;font-size:16px}
.wrow:hover{background:rgba(255,255,255,.10)}
.wrow .dot{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;
  border:2px solid #000;box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),inset -1px -1px 0 rgba(0,0,0,.4)}
.wrow .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .h{font-size:14px;color:var(--faint);max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget .empty{font-size:15px;color:var(--faint);padding:7px 4px}

/* saat widget'i */
.clockw{justify-content:space-between}
.clockw .big{font-size:58px;line-height:.9;letter-spacing:1px}
.clockw .day{font-size:17px;color:var(--dim);margin-top:5px}
.clockw .foot{font-size:13px;color:var(--faint)}

/* yardim widget'i: alti ipucu iki satira sigmiyor, uc satir yuksekliginde */
.widget.help{grid-row:span 3}
/* yardim satirlari */
.hrow{display:flex;flex-direction:column;gap:0;padding:2px 5px}
.hrow b{font-weight:400;font-size:14px;line-height:1.15;color:var(--ink);text-shadow:2px 2px 0 var(--sh)}
.hrow span{font-size:13px;line-height:1.2;color:var(--faint);text-shadow:2px 2px 0 var(--sh)}
/* alt */
.dots{display:flex;justify-content:center;gap:6px;padding:7px 0 6px;flex:none}
.dots span{width:6px;height:6px;background:var(--faint)}
.dots span.on{background:var(--ink)}
.dock{margin:0 auto 14px;padding:9px 12px;display:flex;gap:14px;flex:none;
  background:var(--tile-panel) repeat;background-size:64px 64px;border:2px solid #000;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.dock .app{width:auto;gap:0}
.dock .icon{width:46px;height:46px}
.dock .label{display:none}

/* ekle kutusu */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:9}
.ov.on{display:flex}
.card{width:min(430px,90%);padding:18px 20px;
  background:var(--tile-panel) repeat;background-size:64px 64px;border:2px solid #000;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),0 0 0 4px rgba(0,0,0,.5)}
.card h4{font-size:20px;font-weight:400;margin-bottom:14px}
.card input{width:100%;font-size:17px;padding:8px 10px;margin-bottom:9px;
  background:var(--field);border:2px solid #000;
  box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 #3a3a46,0 0 0 2px var(--edge)}
.card input:focus{box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 #3a3a46,0 0 0 2px #b9bccb}
.card .btns{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}
.card button{font-size:17px;padding:7px 16px;
  background:var(--btn);border:2px solid #000;color:var(--ink);cursor:pointer;font-family:inherit;
  box-shadow:inset 2px 2px 0 var(--btn-hi),inset -2px -2px 0 var(--lo);text-shadow:2px 2px 0 var(--sh)}
.card button:hover{background:var(--btn-hi)}
.card button:active{box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--btn-hi)}
.card button.ok{background:var(--btn-on)}
.card button.ok:hover{background:#5a739a}

body.portrait{--cell:108px;--row:106px;--icon:56px}
body.portrait .spot{width:84%}
body.portrait .clockw .big{font-size:44px}
@media (max-height:700px) and (max-width:900px){body{--cell:100px;--row:98px;--icon:52px}}
</style>
</head>
<body>
<div class="wall"></div><div class="grain"></div>
<div class="status">
  <div class="time"><span id="clock">00:00</span><span class="date" id="date"></span></div>
  <div class="right">doomscroll <span class="bat"></span></div>
</div>
<form class="spot" id="search">
  <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="7" cy="7" r="5.2"/><path d="M11 11l4.5 4.5" stroke-linecap="round"/></svg>
  <input id="q" placeholder="{{home.doomscroll.search_tablet}}" autocomplete="off">
</form>
<div class="pages"><div class="grid" id="grid"></div></div>
<div class="dots"><span class="on"></span><span></span></div>
<div class="dock" id="dock"></div>
<div class="ov" id="ov"><form class="card" id="addf"><h4>{{home.doomscroll.add_home}}</h4><input id="an" placeholder="{{home.doomscroll.add_name}}" autocomplete="off"><input id="au" placeholder="{{home.doomscroll.add_url}}" autocomplete="off"><div class="btns"><button type="button" id="ac">{{home.doomscroll.cancel}}</button><button type="submit" class="ok">{{home.doomscroll.add}}</button></div></form></div>
<script>
/*__DATA__*/
(function () {
  var D = window.__DS || {};
  function orient() { document.body.classList.toggle('portrait', window.innerHeight > window.innerWidth); }
  orient();
  window.addEventListener('resize', orient);

  var G = {
    play: '<svg viewBox="0 0 9 9" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" fill="#fff"><rect x="1" y="0" width="1" height="1"/><rect x="1" y="1" width="2" height="1"/><rect x="1" y="2" width="3" height="1"/><rect x="1" y="3" width="4" height="1"/><rect x="1" y="4" width="5" height="1"/><rect x="1" y="5" width="4" height="1"/><rect x="1" y="6" width="3" height="1"/><rect x="1" y="7" width="2" height="1"/><rect x="1" y="8" width="1" height="1"/></svg>',
    shorts: '<svg viewBox="0 0 9 9" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" fill="#fff"><rect x="2" y="0" width="5" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="2" y="2" width="2" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="2" y="3" width="3" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="2" y="4" width="5" height="1"/><rect x="2" y="5" width="3" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="2" y="6" width="2" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="2" y="7" width="1" height="1"/><rect x="6" y="7" width="1" height="1"/><rect x="2" y="8" width="5" height="1"/></svg>',
    camera: '<svg viewBox="0 0 9 9" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" fill="#fff"><rect x="1" y="0" width="7" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="3" y="3" width="3" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="3" y="5" width="3" height="1"/><rect x="7" y="5" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="7" y="6" width="1" height="1"/><rect x="1" y="7" width="7" height="1"/></svg>',
    note: '<svg viewBox="0 0 9 9" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" fill="#fff"><rect x="4" y="0" width="4" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="2" y="5" width="3" height="1"/><rect x="1" y="6" width="5" height="1"/><rect x="1" y="7" width="5" height="1"/><rect x="2" y="8" width="3" height="1"/></svg>',
    chat: '<svg viewBox="0 0 9 9" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" fill="#fff"><rect x="1" y="0" width="7" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="5" y="3" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="1" y="5" width="7" height="1"/><rect x="3" y="6" width="2" height="1"/><rect x="2" y="7" width="2" height="1"/></svg>',
    bolt: '<svg viewBox="0 0 9 9" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" fill="#fff"><rect x="5" y="0" width="2" height="1"/><rect x="4" y="1" width="2" height="1"/><rect x="3" y="2" width="2" height="1"/><rect x="2" y="3" width="5" height="1"/><rect x="5" y="4" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="3" y="6" width="2" height="1"/><rect x="2" y="7" width="2" height="1"/></svg>'

  var APPS = [
    {n: 'YouTube', u: 'https://www.youtube.com/', c: '#c9352f', g: 'play'},
    {n: 'Shorts', u: 'https://www.youtube.com/shorts', c: '#e04a2c', g: 'shorts'},

    {n: 'TikTok', u: 'https://www.tiktok.com/', c: '#17171d', g: 'note'},
    {n: 'Twitch', u: 'https://www.twitch.tv/', c: '#7a45d6', g: 'chat'},
    {n: 'Kick', u: 'https://kick.com/', c: '#3fae2a', g: 'bolt'}
  ];
  var DOCK = ['YouTube', 'Shorts', 'Reels', 'TikTok', 'Twitch'];
  var order = 0;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function host(u) { try { return new URL(u).host.replace(/^www\./, ''); } catch (e) { return u; } }
  function norm(u) { return (u || '').replace(/\/$/, ''); }
  function cmd(o) { console.log('__DS__' + JSON.stringify(o)); }
  function go(u) { location.href = u; }
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function stagger(e) { e.style.animationDelay = (60 + order++ * 28) + 'ms'; return e; }

  function iconApp(a) {
    var w = el('a', 'app');
    w.href = a.u;
    var ic = el('div', 'icon');
    ic.style.background = a.c;
    ic.innerHTML = G[a.g] || '';
    w.appendChild(ic);
    w.appendChild(el('div', 'label', a.n));
    return w;
  }
  function webClip(b) {
    var w = el('a', 'app');
    w.href = b.url;
    var ic = el('div', 'icon');
    var h = hue(host(b.url));
    ic.style.background = 'hsl(' + h + ',58%,44%)';
    var name = (b.title || host(b.url)).trim();
    ic.appendChild(el('span', null, name ? name.charAt(0).toUpperCase() : '•'));
    w.appendChild(ic);
    w.appendChild(el('div', 'label', b.title || host(b.url)));
    var rm = el('div', 'rm', '');
    rm.title = '{{js:home.doomscroll.remove}}';
    rm.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); cmd({home: 'unbookmark', url: b.url}); w.remove(); };
    w.appendChild(rm);
    return w;
  }

  var grid = document.getElementById('grid');

  // Saat widget'i
  var cw = el('div', 'widget clockw');
  cw.appendChild(el('div', 'foot', '{{js:home.doomscroll.tablet_foot}}'));
  var mid = el('div');
  var big = el('div', 'big', '00:00'); big.id = 'bigClock'; mid.appendChild(big);
  var day = el('div', 'day', ''); day.id = 'bigDate'; mid.appendChild(day);
  cw.appendChild(mid);
  cw.appendChild(el('div', 'foot', '{{js:home.doomscroll.tablet_rotate}}'));
  grid.appendChild(stagger(cw));

  // Gecmis widget'i
  var wd = el('div', 'widget');
  var h3 = el('h3', null, '{{js:home.doomscroll.history}}');
  var clear = el('span', null, '{{js:home.doomscroll.clear}}');
  h3.appendChild(clear);
  wd.appendChild(h3);
  var rows = el('div', 'rows');
  clear.onclick = function () { cmd({home: 'clearHistory'}); rows.innerHTML = ''; rows.appendChild(el('div', 'empty', '{{js:home.doomscroll.history_cleared}}')); };
  var hist = (D.history || []).slice(0, 6);
  if (!hist.length) rows.appendChild(el('div', 'empty', '{{js:home.doomscroll.history_empty}}'));
  hist.forEach(function (it) {

    var d = el('span', 'dot', (it.title || host(it.url)).charAt(0).toUpperCase());
    d.style.background = 'hsl(' + hue(host(it.url)) + ',60%,45%)';
    r.appendChild(d);
    r.appendChild(el('span', 't', it.title || host(it.url)));
    r.appendChild(el('span', 'h', host(it.url)));
    r.onclick = function () { go(it.url); };
    rows.appendChild(r);
  });
  wd.appendChild(rows);
  grid.appendChild(stagger(wd));

  // Yardim widget'i: temel hareketler (en cok takilinan yer burasi)
  var hw = el('div', 'widget help');
  hw.appendChild(el('h3', null, '{{js:home.doomscroll.help_title}}'));
  var hrows = el('div', 'rows');
  [['{{js:home.doomscroll.help.tscroll.t}}', '{{js:home.doomscroll.help.tscroll.d}}'], ['{{js:home.doomscroll.help.trotate.t}}', '{{js:home.doomscroll.help.trotate.d}}'], ['{{js:home.doomscroll.help.tcast.t}}', '{{js:home.doomscroll.help.tcast.d}}'], ['{{js:home.doomscroll.help.tqueue.t}}', '{{js:home.doomscroll.help.tqueue.d}}'], ['{{js:home.doomscroll.help.tmark.t}}', '{{js:home.doomscroll.help.tmark.d}}'], ['{{js:home.doomscroll.help.thome.t}}', '{{js:home.doomscroll.help.thome.d}}']].forEach(function (p) {

  var plus = el('div'); plus.style.cssText = 'width:54%;height:54%;background:#fff;-webkit-mask:var(--ic-plus) center/contain no-repeat;mask:var(--ic-plus) center/contain no-repeat';

  var ov = document.getElementById('ov');

  ov.onclick = function (ev) { if (ev.target === ov) closeAdd(); };
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ov.classList.contains('on')) closeAdd(); });
  document.getElementById('addf').onsubmit = function (ev) {
    ev.preventDefault();
    var u = document.getElementById('au').value.trim();
    if (!u) return;
    if (u.indexOf('://') < 0) u = 'https://' + u;
    var n = document.getElementById('an').value.trim() || host(u);
    cmd({home: 'add', name: n, url: u});

    closeAdd();
  };

  var dock = document.getElementById('dock');
  DOCK.forEach(function (n) {
    var a = APPS.filter(function (x) { return x.n === n; })[0];
    if (a) dock.appendChild(iconApp(a));
  });

  document.getElementById('search').onsubmit = function (ev) {
    ev.preventDefault();
    var q = document.getElementById('q').value.trim();
    if (!q) return;
    var isUrl = /^[a-z]+:\/\//i.test(q) || (q.indexOf('.') > 0 && q.indexOf(' ') < 0);
    if (isUrl) go(q.indexOf('://') < 0 ? 'https://' + q : q);
    else go('https://www.google.com/search?q=' + encodeURIComponent(q));
  };

  var DAYS = ['{{js:home.doomscroll.day.0}}', '{{js:home.doomscroll.day.1}}', '{{js:home.doomscroll.day.2}}', '{{js:home.doomscroll.day.3}}', '{{js:home.doomscroll.day.4}}', '{{js:home.doomscroll.day.5}}', '{{js:home.doomscroll.day.6}}'];
  var MONTHS = ['{{js:home.doomscroll.month.0}}', '{{js:home.doomscroll.month.1}}', '{{js:home.doomscroll.month.2}}', '{{js:home.doomscroll.month.3}}', '{{js:home.doomscroll.month.4}}', '{{js:home.doomscroll.month.5}}', '{{js:home.doomscroll.month.6}}', '{{js:home.doomscroll.month.7}}', '{{js:home.doomscroll.month.8}}', '{{js:home.doomscroll.month.9}}', '{{js:home.doomscroll.month.10}}', '{{js:home.doomscroll.month.11}}'];
  function clock() {
    var d = new Date();
    var t = (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    var dayS = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    document.getElementById('clock').textContent = t;
    document.getElementById('date').textContent = dayS;
    document.getElementById('bigClock').textContent = t;
    document.getElementById('bigDate').textContent = dayS;
  }
  clock();
  setInterval(clock, 10000);
})();
</script>
